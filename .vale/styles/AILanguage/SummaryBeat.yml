extends: existence
message: "Avoid a formulaic summary beat ('%s'). End with the last technical point."
level: warning
link: https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing
ignorecase: true
raw:
  - '(?:\b(?:in conclusion|to sum(?: it)? up|all in all|at the end of the day|the bottom line)\b|\bthe (?:key )?takeaway (?:here )?is\b|\bthat[''’]s (?:the|what) (?:whole )?point\b)'
