# Wikipedia calls this "superficial analysis": a fact, then a comma, then an
# -ing clause that gestures at significance without adding information.
# `signaling` is not listed because telco documentation uses it as a noun and
# as a literal verb, for example "OAM, signaling, and storage traffic".
extends: existence
message: "Avoid a hollow '-ing' significance clause ('%s'). Delete it or state the specific consequence."
level: warning
link: https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing
ignorecase: true
raw:
  - ',\s*(?:highlighting|underscoring|underlining|showcasing|emphasizing|marking|cementing|solidifying|paving the way|further (?:solidifying|cementing))\b'
